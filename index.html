<html lang="ko">
<head>
<meta charset="utf-8">

<style>
  :root { --bg:#111418; --card:#1a1f26; --line:#2a313b; --text:#e8ebef; --sub:#8b95a3; --accent:#4da3ff; --star:#ffc531; --new:#ff5b5b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Noto Sans KR",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 20px 10px; }
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; }
  .upd { color:var(--sub); font-size:13px; }
  .tools { margin-left:auto; display:flex; gap:8px; align-items:center; }
  input, select, button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; font-size:14px; }
  input { width:220px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .tabs { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .tab { padding:7px 14px; border-radius:999px; border:1px solid var(--line); cursor:pointer; font-size:14px; user-select:none; }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:bold; }
  .tab .n { opacity:.75; margin-left:4px; font-size:12px; }
  .tab .nn { background:var(--new); color:#fff; border-radius:999px; padding:0 6px; margin-left:4px; font-size:11px; }
  main { padding:14px 20px 40px; max-width:1100px; }
  .warn { color:#ffb36b; font-size:12px; margin:6px 0 0; }
  .day { color:var(--sub); font-size:13px; margin:18px 0 6px; font-weight:bold; }
  a.item { display:flex; gap:12px; align-items:center; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; }
  a.item:hover { border-color:var(--accent); }
  a.item.visited .t { color:var(--sub); }
  .thumb { width:84px; height:52px; border-radius:6px; background:#222 center/cover no-repeat; flex:none; }
  .body { min-width:0; flex:1; }
  .t { font-size:15px; line-height:1.4; }
  .meta { color:var(--sub); font-size:12px; margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }
  .why { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .why span { color:#ff8a3d; font-size:12px; font-weight:bold; background:rgba(255,138,61,.12); border-radius:4px; padding:1px 6px; }
  /* 휴대폰 화면 */
  @media (max-width: 640px) {
    header { padding:10px 12px 8px; }
    h1 { font-size:17px; }
    .upd { font-size:11px; }
    .tools { margin-left:0; width:100%; flex-wrap:wrap; }
    .tools input { flex:1 1 100%; width:auto; }
    .tools select, .tools button { flex:1; padding:6px 6px; font-size:13px; }
    .tabs { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
    .tab { white-space:nowrap; padding:6px 11px; font-size:13px; }
    main { padding:8px 10px 30px; }
    a.item { padding:9px; gap:9px; align-items:flex-start; }
    .thumb { width:64px; height:40px; }
    .t { font-size:14px; }
  }
  .orig { color:var(--sub); font-size:12px; margin-top:2px; }
  .hot { color:#ff8a3d; font-weight:bold; }
  .chip { border:1px solid var(--line); border-radius:4px; padding:0 5px; }
  .star { color:var(--star); font-weight:bold; }
  .new { background:var(--new); color:#fff; border-radius:4px; padding:0 5px; font-size:11px; font-weight:bold; margin-right:6px; vertical-align:2px; }
  .empty { color:var(--sub); padding:40px 0; text-align:center; }
</style>
</head>

<header>

  <div class="warn" id="warn"></div>
</header>

const fmtTime = ts => { const d = new Date(ts*1000); return d.toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"}); };

$("upd").textContent = "마지막 수집: " + fmtTime(D.updated);
if (D.errors.length) $("warn").textContent = "⚠ 이번에 못 가져온 곳: " + D.errors.map(e => e.split(":")[0]).join(", ");

const GLOBAL = "🌍 해외 핫이슈", TOP = "🔥 주요 소식";
function inTab(it, tab) {
  if (tab === "전체") return true;
  if (tab === TOP) return (it.score || 0) >= D.prioMin && !it.dup;
  if (tab === "★ 관심") return it.star;
  if (tab === GLOBAL) return !!it.global;
  return it.cats.includes(tab);
}
function filtered(tab) {
  const q = $("q").value.trim().toLowerCase();
  const since = Date.now()/1000 - (+$("days").value) * 86400;
  return D.items.filter(it => inTab(it, tab) && it.ts >= since && (!q || (it.title + " " + (it.ko||"") + " " + it.source).toLowerCase().includes(q)));
}
// 인기 점수: 유튜브 조회수, geekhack은 새 댓글 수(1개 = 조회 5천으로 환산)
const hotScore = it => it.hot_kind === "views" ? it.hot : it.hot_kind === "replies" ? it.hot * 5000 : it.hot_kind === "comments" ? it.hot * 3000 : 0;
const fmtHot = it => {
  if (it.hot_kind === "comments" && it.hot) return "💬 해외 댓글 " + it.hot + "개";
  if (it.hot_kind === "views" && it.hot) return "🔥 조회 " + (it.hot >= 10000 ? (it.hot/10000).toFixed(1) + "만" : it.hot.toLocaleString());
  if (it.hot_kind === "replies" && it.hot) return "💬 최근 댓글 " + it.hot + "개";
  return "";
};
function render() {
  const tabs = [D.cats[0], "전체", ...D.cats.slice(1)];
  $("tabs").innerHTML = tabs.map(t => {
    const list = filtered(t), nn = list.filter(i => i.seen > lastRead).length;
    return `<span class="tab ${t===cur?"on":""}" data-t="${esc(t)}">${esc(t)}<span class="n">${list.length}</span>${nn?`<span class="nn">NEW ${nn}</span>`:""}</span>`;
  }).join("");
  let list = filtered(cur);
  const byHot = cur === GLOBAL && $("sort").value === "hot";
  $("sort").style.display = cur === GLOBAL ? "" : "none";
  if (byHot) list = [...list].sort((a, b) => hotScore(b) - hotScore(a) || b.ts - a.ts);
  const byScore = cur === TOP;
  if (byScore) list = [...list].sort((a, b) => b.score - a.score || b.ts - a.ts);
  if (!list.length) { $("list").innerHTML = `<div class="empty">조건에 맞는 소식이 없어요. 기간을 늘리거나 검색어를 지워 보세요.</div>`; return; }
  let html = byHot ? `<div class="day">해외에서 반응이 큰 순서 (유튜브 조회수 · 커뮤니티 댓글 기준)</div>`
           : byScore ? `<div class="day">반응이 큰 순서 · 조회수·추천·보도 수·관심 키워드로 골랐어요</div>` : "", lastDay = "";
  for (const it of list) {
    const day = fmtDay(it.ts);
    if (!byHot && !byScore && day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    const hot = fmtHot(it);
    html += `<a class="item ${visited.has(it.link)?"visited":""}" href="${esc(it.link)}" target="_blank" rel="noopener" data-l="${esc(it.link)}">
      ${it.img ? `<div class="thumb" style="background-image:url('${esc(it.img)}')"></div>` : ""}
      <div class="body"><div class="t">${it.seen > lastRead ? '<span class="new">NEW</span>' : ""}${it.star ? '<span class="star">★ </span>' : ""}${esc(it.ko || it.title)}</div>
      ${it.ko ? `<div class="orig">${esc(it.title)}</div>` : ""}
      ${byScore && it.why && it.why.length ? `<div class="why">${it.why.map(w => `<span>🔥 ${esc(w)}</span>`).join("")}</div>` : ""}
      <div class="meta">${hot && !byScore ? `<span class="hot">${hot}</span>` : ""}<span>${esc(it.source)}</span><span>${fmtTime(it.ts)}</span>${it.cats.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div></div></a>`;
  }
  $("list").innerHTML = html;
}
$("tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (!t) return; cur = t.dataset.t; localStorage.setItem("radar_tab", cur); render(); window.scrollTo(0,0); });
$("list").addEventListener("click", e => { const a = e.target.closest("a.item"); if (!a) return; visited.add(a.dataset.l); localStorage.setItem(LS_VIS, JSON.stringify([...visited].slice(-3000))); a.classList.add("visited"); });
$("q").addEventListener("input", render);
$("days").addEventListener("change", render);
$("sort").addEventListener("change", render);
$("read").addEventListener("click", () => { lastRead = D.updated; localStorage.setItem(LS_LAST, lastRead); render(); });
if (!["전체", ...D.cats].includes(cur)) cur = "전체";
render();
</script>
</body>
</html>
