<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마우스패드 측정 리뷰 시트</title>
<style>
  .viz-root {
    color-scheme: light;
    --page: #f4f4f2;
    --surface-1: #fcfcfb;
    --border: #e3e2de;
    --grid: #ecebe7;
    --axis: #b9b8b2;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --ref: #a3a29c;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --seq-lo: #cde2fb;
    --seq-hi: #104281;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --grid: #262624; --axis: #55544f;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e88;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --ref: #6b6a65;
      --seq-lo: #184f95; --seq-hi: #cde2fb;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --grid: #262624; --axis: #55544f;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e88;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --ref: #6b6a65;
    --seq-lo: #184f95; --seq-hi: #cde2fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    background: var(--page); color: var(--text-primary); min-height: 100vh;
    font: 14px/1.55 -apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .sample-banner {
    border: 1px dashed var(--warning); color: var(--text-secondary); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 20px; font-size: 13px;
  }
  header h1 { font-size: 28px; margin: 4px 0 6px; letter-spacing: -0.02em; }
  .eyebrow { color: var(--text-muted); font-size: 13px; letter-spacing: 0.04em; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text-secondary); margin: 8px 0 14px; }
  .specs b { color: var(--text-primary); font-weight: 600; }
  .cond { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border); background: var(--surface-1); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--text-secondary); }
  section { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-top: 16px; }
  section h2 { font-size: 17px; margin: 0 0 2px; }
  section .sub { color: var(--text-muted); font-size: 13px; margin: 0 0 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .k { color: var(--text-secondary); font-size: 12px; }
  .tile .v { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .n { color: var(--text-muted); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid2 > section { margin-top: 0; }
  .row { margin-top: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--text-secondary); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--border); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .legend i.dot { width: 9px; height: 9px; border-radius: 50%; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--text-muted); font-size: 11px; }
  svg .lbl { fill: var(--text-secondary); font-size: 11.5px; }
  svg .lbl-strong { fill: var(--text-primary); font-size: 12px; font-weight: 600; }
  details { margin-top: 10px; font-size: 13px; color: var(--text-secondary); }
  details summary { cursor: pointer; }
  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-primary); }
  .status .ic { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; }
  .method ol { margin: 0; padding-left: 18px; color: var(--text-secondary); font-size: 13px; }
  .method li { margin: 4px 0; }
  .tooltip {
    position: fixed; pointer-events: none; z-index: 10; opacity: 0; transition: opacity .08s;
    background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
    font-variant-numeric: tabular-nums; min-width: 120px;
  }
  .tooltip .t { color: var(--text-secondary); margin-bottom: 4px; }
  .tooltip .r { display: flex; justify-content: space-between; gap: 12px; }
  .tooltip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  footer { color: var(--text-muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap" id="app"></div>
<div class="tooltip" id="tip"></div>
</div>

<script>
/* =====================================================================
   리뷰 데이터 — 제품마다 이 객체만 바꾸면 페이지 전체가 갱신됩니다.
   sample: true 이면 상단에 "예시 데이터" 배너가 표시됩니다.
   ===================================================================== */
const DATA = {
  sample: true,
  product: {
    brand: "브랜드명",
    name: "제품명 (예: Control XL)",
    size: "490 × 420 mm",
    thickness: "4.0 mm",
    surface: "폴리에스터 평직 + 발수 코팅",
    base: "천연고무 + SBR 폼",
    edge: "저프로파일 스티칭",
    testDate: "2026-11-24",
  },
  conditions: {
    climate: "20 ℃ / 65 %RH (ISO 139), 24 h 상태조절",
    counterface: "버진 PTFE 피트 (Ø 8 mm × 3, 브레이크인 500 m)",
    load: "기준 하중 300 g",
    speed: "기준 속도 0.1 m/s",
    samples: "시료 3장 × 측정점 25개",
    repeatability: 1.5, // 같은 지점 반복측정 표준편차(%) — 이보다 작은 차이는 의미 없음
  },
  // 핵심 마찰값 (기준 하중·속도, 0° 방향)
  friction: { us: 0.392, uk: 0.318 },
  // 방향 × 하중별 μs / μk
  frictionTable: [
    { dir: "0° (가로)",  load: [ [0.405, 0.331], [0.392, 0.318], [0.384, 0.309] ] },
    { dir: "45°",        load: [ [0.411, 0.336], [0.398, 0.322], [0.389, 0.313] ] },
    { dir: "90° (세로)", load: [ [0.418, 0.342], [0.404, 0.327], [0.396, 0.318] ] },
  ],
  loads: [100, 300, 500],
  // 속도별 μk (하중별 곡선)
  speedCurve: {
    speeds: [0.01, 0.03, 0.1, 0.3, 1.0],
    byLoad: {
      100: [0.352, 0.341, 0.331, 0.324, 0.320],
      300: [0.338, 0.328, 0.318, 0.311, 0.306],
      500: [0.329, 0.319, 0.309, 0.301, 0.296],
    },
  },
  // 습도별 μk
  humidity: { rh: [30, 50, 65, 85], uk: [0.309, 0.314, 0.318, 0.334] },
  // 마모 사이클별 μk (Martindale 왕복 후)
  wear: { cycles: ["신품", "1천 회", "1만 회", "10만 회"] /* 왕복 마모 리그, 300 g */, uk: [0.318, 0.312, 0.305, 0.297] },
  // 5×5 면 균일도 μk (좌상단 → 우하단)
  uniformity: [
    [0.331, 0.322, 0.315, 0.319, 0.328],
    [0.321, 0.312, 0.309, 0.314, 0.325],
    [0.318, 0.308, 0.305, 0.311, 0.320],
    [0.324, 0.314, 0.310, 0.316, 0.327],
    [0.335, 0.326, 0.319, 0.323, 0.338],
  ],
  // 베이스
  base: { thickness: 4.02, cfd25: 18.6, compressionSet: 6.2, shore: "Shore 00 42", gripMu: 1.05 },
  // 포지셔닝 비교용 기준 패드 (자사 라인업 등)
  references: [
    { name: "기준 A (스피드)", uk: 0.235 },
    { name: "기준 B (밸런스)", uk: 0.275 },
    { name: "기준 C (컨트롤)", uk: 0.345 },
  ],
  // 센서 호환성
  sensors: [
    { sensor: "PixArt PAW3395 계열", lod: 1.1, cpiDev: -0.8, maxSpeed: "≥ 10 m/s" },
    { sensor: "PixArt PAW3950 계열", lod: 0.9, cpiDev: -0.5, maxSpeed: "≥ 10 m/s" },
    { sensor: "PixArt PMW3389 계열", lod: 1.4, cpiDev: -1.2, maxSpeed: "≥ 10 m/s" },
  ],
  // 내구·마감 (판정: good | warn | fail)
  durability: [
    { item: "마모 저항", method: "ISO 12947-2 Martindale, 9 kPa", result: "100,000 회 이상 파손 없음", judge: "good" },
    { item: "원단–폼 박리 강도", method: "ISO 2411", result: "12.4 N / 50 mm", judge: "good" },
    { item: "세탁 후 치수 변화", method: "ISO 6330 → ISO 5077", result: "가로 −0.6 % / 세로 −0.9 %", judge: "good" },
    { item: "세탁 후 말림", method: "정반, 모서리 들뜸", result: "최대 1.8 mm (30분 후 0.4 mm)", judge: "warn" },
    { item: "마찰 견뢰도", method: "ISO 105-X12 (건/습)", result: "4–5 / 4 급", judge: "good" },
    { item: "땀 견뢰도", method: "ISO 105-E04", result: "4 급", judge: "good" },
    { item: "스티칭 돌출", method: "표면 대비 높이", result: "+0.3 mm", judge: "good" },
  ],
};

/* ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const css = (v) => getComputedStyle($(".viz-root")).getPropertyValue(v).trim();
const f3 = (x) => x.toFixed(3);
const tip = $("#tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => (tip.style.opacity = 0);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function niceTicks(min, max, n = 5) {
  const step0 = (max - min) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0);
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

/* 라인 차트: 공유 x, 크로스헤어 + 툴팁, ≤4 시리즈는 직접 라벨 */
function lineChart(host, { xs, xLabels, xLog, series, yLabel, xTitle, yPad = 0.01 }) {
  const W = 480, H = 250, m = { l: 46, r: series.length > 1 ? 58 : 16, t: 12, b: 38 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, host);
  const all = series.flatMap((s) => s.ys);
  const yMin = Math.min(...all) - yPad, yMax = Math.max(...all) + yPad;
  const ticks = niceTicks(yMin, yMax, 4);
  const y0 = Math.min(yMin, ticks[0]), y1 = Math.max(yMax, ticks[ticks.length - 1]);
  const xv = xLog ? xs.map(Math.log10) : xs.map((_, i) => i);
  const xMin = Math.min(...xv), xMax = Math.max(...xv);
  const X = (i) => m.l + ((xv[i] - xMin) / (xMax - xMin)) * (W - m.l - m.r);
  const Y = (v) => H - m.b - ((v - y0) / (y1 - y0)) * (H - m.t - m.b);
  ticks.forEach((t) => {
    el("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: css("--grid") }, svg);
    el("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }, svg).textContent = t.toFixed(2);
  });
  el("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: css("--axis") }, svg);
  xs.forEach((x, i) => {
    el("text", { x: X(i), y: H - m.b + 16, "text-anchor": "middle" }, svg).textContent = xLabels ? xLabels[i] : x;
  });
  if (xTitle) el("text", { x: (m.l + W - m.r) / 2, y: H - 4, "text-anchor": "middle" }, svg).textContent = xTitle;
  if (yLabel) el("text", { x: 4, y: m.t - 2 }, svg).textContent = yLabel;
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: css("--axis"), "stroke-dasharray": "3 3", opacity: 0 }, svg);
  series.forEach((s) => {
    const c = css(s.color);
    el("path", { d: s.ys.map((v, i) => `${i ? "L" : "M"}${X(i)},${Y(v)}`).join(""), fill: "none", stroke: c, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    s.ys.forEach((v, i) => el("circle", { cx: X(i), cy: Y(v), r: 4, fill: c, stroke: css("--surface-1"), "stroke-width": 2 }, svg));
    if (series.length > 1) {
      const last = s.ys.length - 1;
      el("text", { x: X(last) + 8, y: Y(s.ys[last]) + 4, class: "lbl" }, svg).textContent = s.name;
    }
  });
  const hit = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }, svg);
  hit.addEventListener("mousemove", (e) => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    let bi = 0; xs.forEach((_, i) => { if (Math.abs(X(i) - p.x) < Math.abs(X(bi) - p.x)) bi = i; });
    cross.setAttribute("x1", X(bi)); cross.setAttribute("x2", X(bi)); cross.setAttribute("opacity", 1);
    const head = xLabels ? xLabels[bi] : xs[bi];
    showTip(e, `<div class="t">${xTitle ? xTitle.split(" (")[0] + ": " : ""}${head}</div>` +
      series.map((s) => `<div class="r"><span><span class="sw" style="background:${css(s.color)}"></span>${s.name}</span><b>${f3(s.ys[bi])}</b></div>`).join(""));
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
}

function legend(items) {
  return `<div class="legend">${items.map((i) => `<span><i style="background:var(${i.color})"></i>${i.name}</span>`).join("")}</div>`;
}
function dataTable(head, rows) {
  return `<details><summary>데이터 표 보기</summary><table><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></details>`;
}
const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
const sd = (a) => { const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };

/* ===================================================================== */
function render() {
  const D = DATA, P = D.product, C = D.conditions;
  const flat = D.uniformity.flat();
  const cv = (sd(flat) / mean(flat)) * 100;
  const rhIdx = D.humidity.rh.indexOf(50), rhHi = D.humidity.rh.length - 1;
  const humChange = ((D.humidity.uk[rhHi] - D.humidity.uk[rhIdx]) / D.humidity.uk[rhIdx]) * 100;
  const wearChange = ((D.wear.uk.at(-1) - D.wear.uk[0]) / D.wear.uk[0]) * 100;
  const stop = D.friction.us - D.friction.uk;

  $("#app").innerHTML = `
  ${D.sample ? `<div class="sample-banner">⚠ 예시 데이터로 채운 템플릿입니다. 실제 측정값으로 교체한 뒤 공개하세요.</div>` : ""}
  <header>
    <div class="eyebrow">MOUSEPAD LAB REPORT · ${P.testDate}</div>
    <h1>${P.brand} ${P.name}</h1>
    <div class="specs">
      <span>크기 <b>${P.size}</b></span><span>두께 <b>${P.thickness}</b></span>
      <span>표면 <b>${P.surface}</b></span><span>베이스 <b>${P.base}</b></span><span>마감 <b>${P.edge}</b></span>
    </div>
    <div class="cond">${Object.values(C).filter((c) => typeof c === "string").map((c) => `<span class="chip">${c}</span>`).join("")}<span class="chip">반복정밀도 ±${C.repeatability}%</span></div>
  </header>

  <section>
    <h2>핵심 지표</h2>
    <p class="sub">기준 조건(하중 300 g · 0.1 m/s · 0° 방향)에서 측정한 값입니다.</p>
    <div class="tiles">
      <div class="tile"><div class="k">정지 마찰 μs</div><div class="v">${f3(D.friction.us)}</div><div class="n">초동 저항</div></div>
      <div class="tile"><div class="k">운동 마찰 μk</div><div class="v">${f3(D.friction.uk)}</div><div class="n">활주 저항 · 속도감</div></div>
      <div class="tile"><div class="k">스토핑 Δ(μs−μk)</div><div class="v">${f3(stop)}</div><div class="n">클수록 멈춤이 또렷함</div></div>
      <div class="tile"><div class="k">면 균일도 CV</div><div class="v">${cv.toFixed(1)}%</div><div class="n">25점 μk 변동계수 (장비 반복정밀도 ±${C.repeatability}%)</div></div>
      <div class="tile"><div class="k">습도 민감도</div><div class="v">${humChange >= 0 ? "+" : ""}${humChange.toFixed(1)}%</div><div class="n">μk, 50 → ${D.humidity.rh[rhHi]} %RH</div></div>
      <div class="tile"><div class="k">마모 후 μk 변화</div><div class="v">${wearChange >= 0 ? "+" : ""}${wearChange.toFixed(1)}%</div><div class="n">${D.wear.cycles.at(-1)} 이후</div></div>
    </div>
  </section>

  <section>
    <h2>포지셔닝: 스피드 ↔ 컨트롤</h2>
    <p class="sub">기준 조건의 운동 마찰 μk 기준. 회색 점은 비교용 기준 패드입니다.</p>
    <div id="strip"></div>
  </section>

  <div class="grid2 row">
    <section>
      <h2>속도별 운동 마찰</h2>
      <p class="sub">하중별 μk. 빠르게 움직일수록 얼마나 가벼워지는지 보여줍니다.</p>
      ${legend(D.loads.map((l, i) => ({ name: `${l} g`, color: `--series-${i + 1}` })))}
      <div id="c-speed"></div>
      ${dataTable(["속도 (m/s)", ...D.loads.map((l) => `${l} g`)], D.speedCurve.speeds.map((s, i) => [s, ...D.loads.map((l) => f3(D.speedCurve.byLoad[l][i]))]))}
    </section>
    <section>
      <h2>방향 · 하중별 마찰</h2>
      <p class="sub">μs / μk. 방향 간 차이가 작을수록 대각선 에임이 일정합니다.</p>
      <table>
        <thead><tr><th>방향</th>${D.loads.map((l) => `<th>${l} g</th>`).join("")}</tr></thead>
        <tbody>${D.frictionTable.map((r) => `<tr><td>${r.dir}</td>${r.load.map(([s, k]) => `<td>${f3(s)} / ${f3(k)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table>
      <p class="sub" style="margin-top:12px">방향 이방성 (μk, 300 g): <b style="color:var(--text-primary)">${(((Math.max(...D.frictionTable.map((r) => r.load[1][1])) - Math.min(...D.frictionTable.map((r) => r.load[1][1]))) / D.friction.uk) * 100).toFixed(1)}%</b></p>
    </section>
  </div>

  <div class="grid2 row">
    <section>
      <h2>습도별 운동 마찰</h2>
      <p class="sub">땀·장마철 환경에서 느낌이 얼마나 변하는지 보여줍니다.</p>
      <div id="c-hum"></div>
      ${dataTable(["습도 (%RH)", "μk"], D.humidity.rh.map((r, i) => [r, f3(D.humidity.uk[i])]))}
    </section>
    <section>
      <h2>마모 후 운동 마찰</h2>
      <p class="sub">PTFE 피트로 같은 트랙을 왕복 마모시킨 뒤 그 트랙 위에서 다시 측정한 값입니다.</p>
      <div id="c-wear"></div>
      ${dataTable(["마모", "μk"], D.wear.cycles.map((c, i) => [c, f3(D.wear.uk[i])]))}
    </section>
  </div>

  <div class="grid2 row">
    <section>
      <h2>면 균일도 (5 × 5)</h2>
      <p class="sub">패드 전면 25개 지점의 μk. 마찰이 클수록 진하게(다크 모드는 밝게) 표시됩니다.</p>
      <div id="heat"></div>
      <p class="sub" style="margin:10px 0 0">평균 ${f3(mean(flat))} · 최소 ${f3(Math.min(...flat))} · 최대 ${f3(Math.max(...flat))} · CV ${cv.toFixed(1)}%</p>
    </section>
    <section>
      <h2>베이스 · 쿠션</h2>
      <p class="sub">폼 특성은 손목 압력에 따른 마찰 변화와 연결됩니다.</p>
      <table><tbody>
        <tr><td>실측 두께 (정압 0.5 kPa)</td><td>${D.base.thickness.toFixed(2)} mm</td></tr>
        <tr><td>25 % 압축 하중 (CFD)</td><td>${D.base.cfd25} kPa</td></tr>
        <tr><td>압축 영구변형 (50 % 압축, 22 h, 23 ℃)</td><td>${D.base.compressionSet} %</td></tr>
        <tr><td>경도 (6 mm 이상 적층)</td><td>${D.base.shore}</td></tr>
        <tr><td>바닥 정지 마찰계수 (MDF, 2 kg 추 하중)</td><td>${D.base.gripMu.toFixed(2)}</td></tr>
      </tbody></table>
    </section>
  </div>

  <section>
    <h2>센서 호환성</h2>
    <p class="sub">LOD는 0.1 mm 심 적층, CPI 편차는 리니어 스테이지 300 mm 이동 기준이며, 최대 추적 속도는 회전 원판(반경 15 cm, 637 rpm = 10 m/s)으로 측정합니다.</p>
    <table>
      <thead><tr><th>센서</th><th>LOD (mm)</th><th>CPI 편차</th><th>최대 추적 속도</th></tr></thead>
      <tbody>${D.sensors.map((s) => `<tr><td>${s.sensor}</td><td>${s.lod.toFixed(1)}</td><td>${s.cpiDev > 0 ? "+" : ""}${s.cpiDev.toFixed(1)} %</td><td>${s.maxSpeed}</td></tr>`).join("")}</tbody>
    </table>
  </section>

  <section>
    <h2>내구성 · 마감</h2>
    <p class="sub">공인 시험 규격 기준. 판정은 사내 기준표에 따릅니다.</p>
    <table>
      <thead><tr><th>항목</th><th style="text-align:left">시험 방법</th><th>결과</th><th>판정</th></tr></thead>
      <tbody>${D.durability.map((d) => `<tr><td>${d.item}</td><td style="text-align:left;color:var(--text-secondary)">${d.method}</td><td>${d.result}</td><td>${statusBadge(d.judge)}</td></tr>`).join("")}</tbody>
    </table>
  </section>

  <section class="method">
    <h2>시험 방법</h2>
    <p class="sub">같은 조건으로 측정한 결과끼리만 비교할 수 있습니다.</p>
    <ol>
      <li><b>상태조절</b>: 시료를 ${C.climate}.</li>
      <li><b>마찰</b>: ASTM D1894 / ISO 8295 원리를 적용하되, 실제 마우스 사용 조건에 맞춰 상대재를 ${C.counterface}로 바꿨습니다. 정지 마찰은 출발 피크, 운동 마찰은 정상 구간 평균입니다.</li>
      <li><b>하중 · 속도</b>: 100 / 300 / 500 g, 0.01–1 m/s. 패드 긴 변(유효 행정 약 370 mm)에서 S-커브 가감속 서보 리니어 스테이지를 쓰고, 로드셀은 슬레드에 강결합한 뒤 24bit ADC로 1 kHz 이상 샘플링합니다. 당기는 지점은 피트 높이에 맞추고, 가속 직후의 과도 구간은 빼고 정상 구간만 평균냅니다.</li>
      <li><b>면 균일도</b>: 패드를 5 × 5 격자(셀 약 98 × 84 mm)로 나눠 각 셀 안에서 300 g · 0.1 m/s로 약 30 mm 구간을 측정합니다. 장비 반복정밀도(±${C.repeatability}%) 이내의 차이는 같은 값으로 봅니다.</li>
      <li><b>습도</b>: 각 습도 조건에서 24 h 상태조절한 뒤, 같은 조건의 챔버 안에서 측정합니다.</li>
      <li><b>베이스</b>: ASTM D1056 (25 % 압축 하중), ISO 1856 (50 % 압축 영구변형), ASTM D2240 (경도). 두께가 규격 최소치보다 얇으면 적층해서 측정합니다.</li><li><b>마모</b>: 원단 자체 마모 저항은 Martindale(ISO 12947-2)로, 사용에 따른 마찰 변화는 PTFE 피트 왕복 마모 리그로 따로 측정합니다.</li>
      <li><b>통계</b>: ${C.samples}. 표시값은 평균이며, 측정점별 원자료는 요청 시 제공합니다.</li>
    </ol>
  </section>
  <footer>본 리포트의 수치는 표기된 시험 조건에서의 결과이며, 사용 환경(피트 재질·상태, 책상 재질, 습도)에 따라 체감이 달라질 수 있습니다.</footer>
  `;

  // 포지셔닝 스트립
  (() => {
    const host = $("#strip"), W = 960, H = 92, l = 30, r = 30;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}` }, host);
    const pts = [...D.references.map((x) => ({ ...x, me: false })), { name: `${P.name}`, uk: D.friction.uk, me: true }];
    const lo = Math.min(0.2, ...pts.map((p) => p.uk)) , hi = Math.max(0.4, ...pts.map((p) => p.uk));
    const X = (v) => l + ((v - lo) / (hi - lo)) * (W - l - r), cy = 46;
    el("line", { x1: l, x2: W - r, y1: cy, y2: cy, stroke: css("--axis"), "stroke-width": 2 }, svg);
    niceTicks(lo, hi, 8).forEach((t) => {
      el("line", { x1: X(t), x2: X(t), y1: cy - 4, y2: cy + 4, stroke: css("--axis") }, svg);
      el("text", { x: X(t), y: cy + 22, "text-anchor": "middle" }, svg).textContent = t.toFixed(2);
    });
    el("text", { x: l, y: H - 2, class: "lbl" }, svg).textContent = "← 스피드 (μk 낮음)";
    el("text", { x: W - r, y: H - 2, "text-anchor": "end", class: "lbl" }, svg).textContent = "컨트롤 (μk 높음) →";
    pts.sort((a, b) => a.me - b.me).forEach((p) => {
      const g = el("g", {}, svg);
      el("circle", { cx: X(p.uk), cy, r: p.me ? 8 : 6, fill: css(p.me ? "--series-1" : "--ref"), stroke: css("--surface-1"), "stroke-width": 2 }, g);
      el("text", { x: X(p.uk), y: cy - 16, "text-anchor": "middle", class: p.me ? "lbl-strong" : "lbl" }, g).textContent = p.name;
      el("circle", { cx: X(p.uk), cy, r: 14, fill: "transparent" }, g)
        .addEventListener("mousemove", (e) => showTip(e, `<div class="t">${p.name}</div><div class="r"><span>μk</span><b>${f3(p.uk)}</b></div>`));
      g.addEventListener("mouseleave", hideTip);
    });
  })();

  lineChart($("#c-speed"), {
    xs: D.speedCurve.speeds, xLog: true, xTitle: "속도 (m/s, 로그)", yLabel: "μk",
    series: D.loads.map((l, i) => ({ name: `${l} g`, color: `--series-${i + 1}`, ys: D.speedCurve.byLoad[l] })),
  });
  lineChart($("#c-hum"), {
    xs: D.humidity.rh, xLabels: D.humidity.rh.map((r) => r + "%"), xTitle: "상대습도 (%RH)", yLabel: "μk",
    series: [{ name: "μk", color: "--series-1", ys: D.humidity.uk }],
  });
  lineChart($("#c-wear"), {
    xs: D.wear.cycles, xLabels: D.wear.cycles, xTitle: "마모 사이클", yLabel: "μk",
    series: [{ name: "μk", color: "--series-1", ys: D.wear.uk }],
  });

  // 히트맵
  (() => {
    const host = $("#heat"), n = D.uniformity.length, cell = 64, gap = 2, pad = 0;
    const W = n * cell, svg = el("svg", { viewBox: `0 0 ${W} ${W}`, style: "max-width:340px;margin:0 auto" }, host);
    const lo = Math.min(...flat), hi = Math.max(...flat);
    const mix = (a, b, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
      const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; };
    const sLo = css("--seq-lo"), sHi = css("--seq-hi");
    D.uniformity.forEach((row, r) => row.forEach((v, c) => {
      const t = hi === lo ? 0.5 : (v - lo) / (hi - lo);
      const g = el("g", {}, svg);
      el("rect", { x: c * cell + gap / 2 + pad, y: r * cell + gap / 2, width: cell - gap, height: cell - gap, rx: 4, fill: mix(sLo, sHi, t) }, g);
      const dark = document.documentElement.dataset.theme === "dark" || (matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light");
      const ink = (dark ? t < 0.55 : t > 0.55) ? "#ffffff" : "#0b0b0b";
      el("text", { x: c * cell + cell / 2, y: r * cell + cell / 2 + 4, "text-anchor": "middle", style: `fill:${ink};font-size:12px` }, g).textContent = f3(v);
      g.addEventListener("mousemove", (e) => showTip(e, `<div class="t">${r + 1}행 ${c + 1}열</div><div class="r"><span>μk</span><b>${f3(v)}</b></div><div class="r"><span>평균 대비</span><b>${(((v - mean(flat)) / mean(flat)) * 100).toFixed(1)}%</b></div>`));
      g.addEventListener("mouseleave", hideTip);
    }));
  })();
}
function statusBadge(j) {
  const m = { good: ["--good", "✓", "적합"], warn: ["--warning", "!", "주의"], fail: ["--critical", "✕", "부적합"] }[j];
  return `<span class="status"><span class="ic" style="background:var(${m[0]})">${m[1]}</span>${m[2]}</span>`;
}
render();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
</script>
</body>
</html>
